<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TC Delivery</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Sarabun', sans-serif; background: #f5f5f5; }
    .header {
      background: #06C755;
      color: white;
      padding: 16px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .back-header {
      background: #06C755;
      color: white;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 18px;
      font-weight: bold;
      position: sticky;
      top: 0;
      z-index: 100;
      cursor: pointer;
    }
    .section { padding: 16px; }
    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
      color: #333;
    }
    .restaurant-list { display: flex; flex-direction: column; gap: 12px; }
    .restaurant-card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      cursor: pointer;
    }
    .restaurant-name { font-size: 16px; font-weight: bold; color: #333; }
    .restaurant-area { font-size: 13px; color: #888; margin-top: 4px; }
    .restaurant-fee { font-size: 13px; color: #06C755; margin-top: 4px; }
    .menu-list { display: flex; flex-direction: column; gap: 10px; }
    .menu-item {
      background: white;
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .menu-name { font-size: 15px; font-weight: bold; color: #333; }
    .menu-desc { font-size: 12px; color: #888; margin-top: 2px; }
    .menu-price { font-size: 15px; color: #06C755; font-weight: bold; margin-top: 4px; }
    .qty-control {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }
    .qty-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid #06C755;
      background: white;
      color: #06C755;
      font-size: 18px;
      cursor: pointer;
      font-weight: bold;
    }
    .qty-num { font-size: 16px; font-weight: bold; min-width: 20px; text-align: center; }
    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #06C755;
      color: white;
      padding: 16px 20px;
      display: none;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      z-index: 200;
    }
    .cart-bar.show { display: flex; }
    .order-summary {
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .order-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 14px;
    }
    .order-row:last-child { border-bottom: none; }
    .order-total { font-weight: bold; font-size: 16px; color: #06C755; }
    .input-group { margin-bottom: 14px; }
    .input-label { font-size: 14px; color: #555; margin-bottom: 6px; display: block; font-weight: bold; }
    .input-field {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Sarabun', sans-serif;
    }
    textarea.input-field { height: 80px; resize: none; }
    .location-btn {
      width: 100%;
      padding: 14px;
      background: #4285F4;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .location-btn.success { background: #06C755; }
    .map-link {
      display: block;
      text-align: center;
      padding: 10px;
      background: #f0fff4;
      border: 1px solid #06C755;
      border-radius: 8px;
      color: #06C755;
      font-size: 14px;
      text-decoration: none;
      margin-top: 8px;
    }
    .payment-options { display: flex; gap: 10px; margin-bottom: 16px; }
    .payment-btn {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 2px solid #ddd;
      background: white;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
    }
    .payment-btn.selected {
      border-color: #06C755;
      background: #f0fff4;
      color: #06C755;
      font-weight: bold;
    }
    .confirm-btn {
      width: 100%;
      padding: 16px;
      background: #06C755;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 30px;
    }
    .confirm-btn:disabled { background: #ccc; cursor: not-allowed; }
    .loading { text-align: center; padding: 40px; color: #888; font-size: 16px; }
    .page { display: none; }
    .page.active { display: block; }
    .success-page { text-align: center; padding: 60px 20px; }
    .success-icon { font-size: 80px; margin-bottom: 20px; }
    .success-title { font-size: 24px; font-weight: bold; color: #06C755; margin-bottom: 10px; }
    .success-detail { font-size: 15px; color: #555; margin-bottom: 30px; line-height: 1.8; }
    .order-again-btn {
      padding: 14px 40px;
      background: #06C755;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<!-- หน้า 1: เลือกร้าน -->
<div id="page-restaurant" class="page active">
  <div class="header">🍔 TC Delivery</div>
  <div class="section">
    <div class="section-title">🏪 เลือกร้านอาหาร</div>
    <div id="restaurant-list" class="restaurant-list">
      <div class="loading">⏳ กำลังโหลดร้านอาหาร...</div>
    </div>
  </div>
</div>

<!-- หน้า 2: เลือกเมนู -->
<div id="page-menu" class="page">
  <div class="back-header" onclick="showPage('page-restaurant')">
    ← <span id="menu-title">เลือกเมนู</span>
  </div>
  <div class="section">
    <div id="menu-list" class="menu-list">
      <div class="loading">⏳ กำลังโหลดเมนู...</div>
    </div>
  </div>
  <div style="height: 80px;"></div>
</div>

<!-- หน้า 3: ยืนยันออร์เดอร์ -->
<div id="page-confirm" class="page">
  <div class="back-header" onclick="showPage('page-menu')">
    ← ยืนยันออร์เดอร์
  </div>
  <div class="section">
    <div class="section-title">📋 สรุปออร์เดอร์</div>
    <div id="order-summary" class="order-summary"></div>
  </div>
  <div class="section">
    <div class="section-title">📝 ข้อมูลผู้รับ</div>
    <div class="input-group">
      <label class="input-label">ชื่อผู้รับ</label>
      <input type="text" id="input-name" class="input-field" placeholder="ชื่อ-นามสกุล">
    </div>
    <div class="input-group">
      <label class="input-label">เบอร์โทรศัพท์</label>
      <input type="tel" id="input-phone" class="input-field" placeholder="08x-xxx-xxxx">
    </div>
    <div class="input-group">
      <label class="input-label">ที่อยู่จัดส่ง</label>
      <textarea id="input-address" class="input-field" placeholder="บ้านเลขที่ หมู่ ซอย ถนน (กรอกเพิ่มเติม)"></textarea>
    </div>
  </div>

  <div class="section">
    <div class="section-title">📍 ตำแหน่งจัดส่ง</div>
    <div class="input-group">
      <button class="location-btn" id="location-btn" onclick="getLocation()">
        📍 กดเพื่อแชร์ตำแหน่งปัจจุบัน
      </button>
      <div id="location-status" style="font-size:13px; color:#888; text-align:center;"></div>
      <a id="map-link" href="#" target="_blank" class="map-link" style="display:none;">
        🗺️ ดูตำแหน่งใน Google Maps
      </a>
    </div>
  </div>

  <div class="section">
    <div class="section-title">💳 วิธีชำระเงิน</div>
    <div class="payment-options">
      <div class="payment-btn selected" id="pay-cod" onclick="selectPayment('cod')">
        💵 เก็บปลายทาง
      </div>
      <div class="payment-btn" id="pay-online" onclick="selectPayment('online')">
        📱 โอนเงิน
      </div>
    </div>
    <button class="confirm-btn" id="confirm-btn" onclick="submitOrder()">
      ✅ ยืนยันการสั่งอาหาร
    </button>
  </div>
</div>

<!-- หน้า 4: สำเร็จ -->
<div id="page-success" class="page">
  <div class="header">🎉 TC Delivery</div>
  <div class="success-page">
    <div class="success-icon">🎉</div>
    <div class="success-title">สั่งอาหารสำเร็จ!</div>
    <div class="success-detail" id="success-detail"></div>
    <button class="order-again-btn" onclick="resetOrder()">
      🍔 สั่งอาหารอีกครั้ง
    </button>
  </div>
</div>

<!-- ตะกร้า -->
<div class="cart-bar" id="cart-bar" onclick="showPage('page-confirm')">
  <div id="cart-count">0 รายการ</div>
  <div>ดูตะกร้า →</div>
  <div id="cart-total" style="font-weight:bold;">฿0</div>
</div>

<script>
// ==========================================
// CONFIG
// ==========================================
var LIFF_ID = "2009898131-r04F0yrZ";
var GAS_URL = "https://script.google.com/macros/s/AKfycbzW3WKw_yUXEAKQgJOxG18zAdC_QDO6CKMy5FV7rz6_z5f9Dkk4iKegGJi-e68BSK-f/exec";

// ==========================================
// ตัวแปร Global
// ==========================================
var userId = "";
var displayName = "";
var selectedRestaurant = null;
var cart = {};
var paymentType = "cod";
var userLat = "";
var userLng = "";

// ==========================================
// เริ่มต้น LIFF
// ==========================================
window.onload = async function() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }
    var profile = await liff.getProfile();
    userId = profile.userId;
    displayName = profile.displayName;
    loadRestaurants();
  } catch(e) {
    loadRestaurants();
  }
};

// ==========================================
// โหลดร้านอาหาร
// ==========================================
function loadRestaurants() {
  renderRestaurants(sampleRestaurants());
}

function sampleRestaurants() {
  return [
    { id: "R001", name: "ข้าวมันไก่ดี", area: "ใจกลางอำเภอ", deliveryFee: 20, status: "open" },
    { id: "R002", name: "ก๋วยเตี๋ยวเรือนาย", area: "ตลาดเช้า", deliveryFee: 25, status: "open" },
    { id: "R003", name: "ส้มตำป้าแดง", area: "ถนนหลัก", deliveryFee: 20, status: "open" }
  ];
}

function sampleMenus(restaurantId) {
  var menus = {
    "R001": [
      { id: "M001", name: "ข้าวมันไก่", desc: "ข้าวมันไก่ต้ม", price: 50 },
      { id: "M002", name: "ข้าวมันไก่ทอด", desc: "กรอบอร่อย", price: 55 },
      { id: "M003", name: "น้ำซุปไก่", desc: "ร้อนๆ", price: 15 }
    ],
    "R002": [
      { id: "M004", name: "ก๋วยเตี๋ยวน้ำใส", desc: "เส้นใหญ่/เล็ก", price: 50 },
      { id: "M005", name: "ก๋วยเตี๋ยวต้มยำ", desc: "รสจัดจ้าน", price: 55 }
    ],
    "R003": [
      { id: "M006", name: "ส้มตำไทย", desc: "รสกลมกล่อม", price: 45 },
      { id: "M007", name: "ส้มตำปู", desc: "ปูเค็มรสเด็ด", price: 55 },
      { id: "M008", name: "ข้าวเหนียว", desc: "นึ่งสด", price: 10 }
    ]
  };
  return menus[restaurantId] || [];
}

// ==========================================
// แสดงร้านอาหาร
// ==========================================
function renderRestaurants(restaurants) {
  var html = "";
  restaurants.forEach(function(r) {
    if (r.status != "open") return;
    html += '<div class="restaurant-card" onclick=\'selectRestaurant(' + JSON.stringify(r) + ')\'>' +
      '<div>' +
      '<div class="restaurant-name">' + r.name + '</div>' +
      '<div class="restaurant-area">📍 ' + r.area + '</div>' +
      '<div class="restaurant-fee">🛵 ค่าส่ง ' + r.deliveryFee + ' บาท</div>' +
      '</div>' +
      '<div style="font-size:24px; color:#ccc">›</div>' +
      '</div>';
  });
  document.getElementById("restaurant-list").innerHTML = html;
}

// ==========================================
// เลือกร้าน
// ==========================================
function selectRestaurant(restaurant) {
  selectedRestaurant = restaurant;
  cart = {};
  updateCartBar();
  document.getElementById("menu-title").innerText = "🍜 " + restaurant.name;
  document.getElementById("menu-list").innerHTML = '<div class="loading">⏳ กำลังโหลดเมนู...</div>';
  showPage("page-menu");
  renderMenus(sampleMenus(restaurant.id));
}

// ==========================================
// แสดงเมนู
// ==========================================
function renderMenus(menus) {
  var html = "";
  menus.forEach(function(m) {
    html += '<div class="menu-item">' +
      '<div class="menu-name">' + m.name + '</div>' +
      '<div class="menu-desc">' + m.desc + '</div>' +
      '<div class="menu-price">฿' + m.price + '</div>' +
      '<div class="qty-control">' +
      '<button class="qty-btn" onclick=\'changeQty("' + m.id + '", -1)\'>−</button>' +
      '<span class="qty-num" id="qty-' + m.id + '">0</span>' +
      '<button class="qty-btn" onclick=\'changeQty("' + m.id + '", 1, ' + JSON.stringify(m) + ')\'>+</button>' +
      '</div>' +
      '</div>';
  });
  document.getElementById("menu-list").innerHTML = html;
}

// ==========================================
// เพิ่ม/ลดจำนวน
// ==========================================
function changeQty(menuId, delta, menuData) {
  if (delta > 0 && !cart[menuId] && menuData) {
    cart[menuId] = { id: menuData.id, name: menuData.name, price: menuData.price, qty: 0 };
  }
  if (!cart[menuId]) return;
  cart[menuId].qty += delta;
  if (cart[menuId].qty <= 0) delete cart[menuId];
  var el = document.getElementById("qty-" + menuId);
  if (el) el.innerText = cart[menuId] ? cart[menuId].qty : 0;
  updateCartBar();
}

// ==========================================
// อัปเดตตะกร้า
// ==========================================
function updateCartBar() {
  var total = 0; var count = 0;
  Object.values(cart).forEach(function(i) { total += i.price * i.qty; count += i.qty; });
  document.getElementById("cart-count").innerText = count + " รายการ";
  document.getElementById("cart-total").innerText = "฿" + total;
  var bar = document.getElementById("cart-bar");
  count > 0 ? bar.classList.add("show") : bar.classList.remove("show");
}

// ==========================================
// สรุปออร์เดอร์
// ==========================================
function renderOrderSummary() {
  var subtotal = 0;
  var html = "";
  Object.values(cart).forEach(function(item) {
    var t = item.price * item.qty;
    subtotal += t;
    html += '<div class="order-row"><span>' + item.name + ' x' + item.qty + '</span><span>฿' + t + '</span></div>';
  });
  var fee = selectedRestaurant ? selectedRestaurant.deliveryFee : 0;
  html += '<div class="order-row"><span>ค่าส่ง</span><span>฿' + fee + '</span></div>';
  html += '<div class="order-row order-total"><span>รวมทั้งหมด</span><span>฿' + (subtotal + fee) + '</span></div>';
  document.getElementById("order-summary").innerHTML = html;
}

// ==========================================
// GPS Location
// ==========================================
function getLocation() {
  var btn = document.getElementById("location-btn");
  var status = document.getElementById("location-status");
  if (!navigator.geolocation) {
    status.innerText = "❌ เบราว์เซอร์ไม่รองรับ GPS";
    status.style.color = "red";
    return;
  }
  btn.innerText = "⏳ กำลังระบุตำแหน่ง...";
  btn.disabled = true;
  navigator.geolocation.getCurrentPosition(
    function(pos) {
      userLat = pos.coords.latitude;
      userLng = pos.coords.longitude;
      btn.innerText = "✅ บันทึกตำแหน่งแล้ว";
      btn.classList.add("success");
      btn.disabled = false;
      status.innerText = "พิกัด: " + userLat.toFixed(5) + ", " + userLng.toFixed(5);
      status.style.color = "#06C755";
      var mapUrl = "https://www.google.com/maps?q=" + userLat + "," + userLng;
      var link = document.getElementById("map-link");
      link.href = mapUrl;
      link.style.display = "block";
    },
    function(err) {
      btn.innerText = "📍 กดเพื่อแชร์ตำแหน่งปัจจุบัน";
      btn.disabled = false;
      status.style.color = "red";
      if (err.code == 1) {
        status.innerText = "❌ กรุณาอนุญาตให้เข้าถึง GPS ในเบราว์เซอร์";
      } else {
        status.innerText = "❌ ระบุตำแหน่งไม่ได้ ลองใหม่อีกครั้ง";
      }
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

// ==========================================
// เลือกวิธีชำระเงิน
// ==========================================
function selectPayment(type) {
  paymentType = type;
  document.getElementById("pay-cod").classList.toggle("selected", type == "cod");
  document.getElementById("pay-online").classList.toggle("selected", type == "online");
}

// ==========================================
// ส่งออร์เดอร์
// ==========================================
function submitOrder() {
  var name = document.getElementById("input-name").value.trim();
  var phone = document.getElementById("input-phone").value.trim();
  var address = document.getElementById("input-address").value.trim();
  if (!name || !phone) {
    alert("กรุณากรอกชื่อและเบอร์โทรครับ");
    return;
  }
  var btn = document.getElementById("confirm-btn");
  btn.disabled = true;
  btn.innerText = "⏳ กำลังส่งออร์เดอร์...";
  var subtotal = 0;
  var items = [];
  Object.values(cart).forEach(function(item) {
    subtotal += item.price * item.qty;
    items.push({ menuId: item.id, menuName: item.name, qty: item.qty, price: item.price, total: item.price * item.qty });
  });
  var fee = selectedRestaurant.deliveryFee;
  var total = subtotal + fee;
  var mapsUrl = userLat ? "https://www.google.com/maps?q=" + userLat + "," + userLng : "";
  var orderData = {
    action: "submitOrder",
    userId: userId,
    displayName: displayName,
    restaurantId: selectedRestaurant.id,
    restaurantName: selectedRestaurant.name,
    items: items,
    subtotal: subtotal,
    deliveryFee: fee,
    total: total,
    paymentType: paymentType,
    name: name,
    phone: phone,
    address: address,
    lat: userLat,
    lng: userLng,
    mapsUrl: mapsUrl
  };
  fetch(GAS_URL, {
    method: "POST",
    body: JSON.stringify(orderData)
  })
  .then(function(r) { return r.json(); })
  .then(function(res) {
    var payText = paymentType == "cod" ? "💵 เก็บปลายทาง" : "📱 โอนเงิน";
    document.getElementById("success-detail").innerHTML =
      "หมายเลขออร์เดอร์: <strong>" + res.orderId + "</strong><br>" +
      "ร้าน: " + selectedRestaurant.name + "<br>" +
      "ยอดรวม: ฿" + total + "<br>" +
      "ชำระเงิน: " + payText + "<br><br>" +
      "⏳ รอร้านยืนยันออร์เดอร์<br>ระบบจะแจ้งเตือนทาง LINE ครับ";
    showPage("page-success");
  })
  .catch(function() {
    alert("เกิดข้อผิดพลาด กรุณาลองใหม่ครับ");
    btn.disabled = false;
    btn.innerText = "✅ ยืนยันการสั่งอาหาร";
  });
}

// ==========================================
// Reset ออร์เดอร์
// ==========================================
function resetOrder() {
  cart = {};
  selectedRestaurant = null;
  userLat = "";
  userLng = "";
  paymentType = "cod";
  document.getElementById("input-name").value = "";
  document.getElementById("input-phone").value = "";
  document.getElementById("input-address").value = "";
  document.getElementById("location-btn").innerText = "📍 กดเพื่อแชร์ตำแหน่งปัจจุบัน";
  document.getElementById("location-btn").classList.remove("success");
  document.getElementById("location-status").innerText = "";
  document.getElementById("map-link").style.display = "none";
  document.getElementById("pay-cod").classList.add("selected");
  document.getElementById("pay-online").classList.remove("selected");
  updateCartBar();
  showPage("page-restaurant");
  loadRestaurants();
}

// ==========================================
// เปลี่ยนหน้า
// ==========================================
function showPage(pageId) {
  document.querySelectorAll(".page").forEach(function(p) { p.classList.remove("active"); });
  document.getElementById(pageId).classList.add("active");
  if (pageId == "page-confirm") renderOrderSummary();
  window.scrollTo(0, 0);
}
</script>
